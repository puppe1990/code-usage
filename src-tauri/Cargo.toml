[package]
name = "code-usage"
version = "0.1.0"
description = "Menu bar usage monitor for Command Code, Grok and OpenCode"
edition = "2021"
rust-version = "1.77"

[lib]
name = "code_usage_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json", "native-tls", "system-proxy"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["std", "NSScreen", "NSEvent"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = false

[profile.release]
debug = false
strip = true
